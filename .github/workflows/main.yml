name: Build Thai Step by Step Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Project, Web UI Permissions & Custom App Icon
        run: |
          # 1. Remove legacy speech_to_text plugin (fixes jcenter() error)
          sed -i '/speech_to_text/d' pubspec.yaml

          # 2. Back up Dart code & pubspec and generate fresh Android Gradle wrapper
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak
          rm -rf android test
          flutter create --platforms=android --org com.dennisho35.thaistepbystep.international --project-name thai_step_by_step .
          rm -rf test
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf lib && mv lib_bak lib

          # 3. CRITICAL FIX FOR WEB UI IN APK: Inject INTERNET & RECORD_AUDIO permissions into AndroidManifest.xml
          # Without INTERNET permission in release APK, Tailwind CSS CDN & Google Fonts & Cloud TTS were blocked!
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.RECORD_AUDIO"\/><application android:usesCleartextTraffic="true"/g' "$MANIFEST"
            sed -i 's/android:label="thai_step_by_step"/android:label="Thai Step by Step"/g' "$MANIFEST"
          fi

          # 4. Install Custom App Logo (from app_icons/ or Thai step by step.jpeg)
          rm -rf android/app/src/main/res/mipmap-anydpi*
          rm -f android/app/src/main/res/mipmap-*/*.webp
          if [ -d "app_icons" ]; then
            cp -r app_icons/mipmap-* android/app/src/main/res/
          fi
          ICON_SRC=""
          if [ -f "Thai step by step.jpeg" ]; then ICON_SRC="Thai step by step.jpeg"; elif [ -f "app_icon.png" ]; then ICON_SRC="app_icon.png"; fi
          if [ -n "$ICON_SRC" ] && command -v convert >/dev/null 2>&1; then
            convert "$ICON_SRC" -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

          # 5. AGP 9+ compatibility flags in android/gradle.properties
          touch android/gradle.properties
          sed -i '/android.newDsl/d' android/gradle.properties
          echo "" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties

          # 6. Set compileSdk = 36, minSdk = 26, targetSdk = 35
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 26/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdk .*/compileSdk 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 26/g' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk 26/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' android/app/build.gradle
            sed -i 's/targetSdk .*/targetSdk 35/g' android/app/build.gradle
          fi

      - name: Install Dependencies & Run QA Verification
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK (compileSdk 36 / minSdk 26 / targetSdk 35)
        run: |
          flutter build apk --release

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thai-Step-by-Step-International-v2.3-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
